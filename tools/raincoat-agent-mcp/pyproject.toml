[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raincoat-agent-mcp"
dynamic = ["version"]
description = "Delegate MCP tasks to local Bitto and WorkBuddy runtimes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "websockets>=14,<17", "packaging>=23"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: MacOS"]

[project.scripts]
local-agent = "raincoat_agent_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raincoat_agent_mcp = ["workbuddy.mjs"]

[tool.setuptools.dynamic]
version = {attr = "raincoat_agent_mcp._version.__version__"}
