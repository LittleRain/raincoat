name: Raincoat Agent MCP package

on:
  workflow_dispatch:
  push:
    tags:
      - 'raincoat-agent-mcp/v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install build and test dependencies
        run: python -m pip install 'setuptools>=77' wheel build twine -e tools/raincoat-agent-mcp
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from raincoat_agent_mcp import __version__
          assert os.environ['RELEASE_TAG'] == f'raincoat-agent-mcp/v{__version__}'
          PY
      - name: Model-free regression tests
        run: python -m unittest discover -s tools/raincoat-agent-mcp/tests -v
      - name: Build wheel and source distribution
        run: python -m build tools/raincoat-agent-mcp --outdir dist-raincoat-agent-mcp
      - name: Check distribution metadata
        run: python -m twine check dist-raincoat-agent-mcp/*
      - name: Isolated install, upgrade and rollback
        run: python tools/raincoat-agent-mcp/tests/distribution_smoke.py dist-raincoat-agent-mcp/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: raincoat-agent-mcp-dist
          path: dist-raincoat-agent-mcp/*
          if-no-files-found: error

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install test dependencies
        run: python -m pip install -e tools/raincoat-agent-mcp
      - name: Windows regression tests
        env:
          RAINCOAT_DEBUG_WINDOWS_PROCESS: '1'
        run: python -m unittest discover -s tools/raincoat-agent-mcp/tests -v
      - name: Build Windows wheel
        run: uv build tools/raincoat-agent-mcp --wheel --out-dir dist-raincoat-agent-mcp
      - name: Windows isolated install and MCP handshake
        run: |
          $wheel = (Get-ChildItem 'dist-raincoat-agent-mcp/*.whl' | Select-Object -First 1).FullName
          python tools/raincoat-agent-mcp/tests/distribution_smoke.py $wheel

  publish:
    needs: [build, windows-test]
    if: startsWith(github.ref, 'refs/tags/raincoat-agent-mcp/v') && vars.LOCAL_AGENT_MCP_PYPI_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: raincoat-agent-mcp-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
